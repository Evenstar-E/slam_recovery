  <g id="text_35">
   <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #526476" transform="translate(40.32 540.763438)">反例 R2：调用当前管理器，真实起点 10 s、14 s 报警、2 s 缓冲；创建的“8 s checkpoint”仍含 9–12 s 状态。</text>
   <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #526476" transform="translate(40.32 555.84)">结论：缓存只在有限检测延迟下防止新污染；更早的污染必须依赖真实历史 checkpoint 与可撤销日志。</text>
  </g>
